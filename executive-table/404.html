<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>找不到這一頁｜幸福餐桌</title>
<link rel="icon" href="/images/favicon.png" type="image/png">
<style>
  :root { --paper: #FAF6EF; --ink: #2A2520; --mist: #736C63; --moss: #547050; --line: #D9D1C2; }
  @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --paper: #191714; --ink: #ECE5D8; --mist: #A39A8C; --moss: #93B38A; --line: #3A352E; } }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { min-height: 100vh; display: grid; place-items: center; padding: 2rem 1.25rem; box-sizing: border-box;
         font-family: "Noto Serif TC", "Songti TC", "PingFang TC", "Microsoft JhengHei", serif; line-height: 1.8; }
  main { max-width: 32rem; display: grid; gap: 1rem; }
  h1 { margin: 0; font-weight: 400; font-size: 1.6rem; letter-spacing: 0.06em; }
  p { margin: 0; color: var(--mist); }
  nav { display: flex; flex-wrap: wrap; gap: 0.6rem 1.4rem; margin-top: 0.6rem; }
  a { color: var(--moss); text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 0.1rem; }
  a:hover, a:focus-visible { border-color: var(--moss); }
</style>
</head>
<body>
<main>
  <h1>這張桌子不在這裡</h1>
  <p>網址可能打錯了，或這一頁已經搬走。</p>
  <nav>
    <a href="/">回到幸福餐桌課程</a>
    <a href="/zh-cn/" lang="zh-Hans">简体中文版</a>
  </nav>
</main>
</body>
</html>
