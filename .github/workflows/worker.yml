name: Deploy Worker to Cloudflare

# 幸福餐桌課程頁＋表單／訂單／管理頁的 Cloudflare Worker（wrangler.jsonc）。
# 合併到 main 且動到 Worker 相關檔案時自動部署；也可以在 Actions 頁手動按「Run workflow」。
# 需要兩個 GitHub Secrets（Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN   Cloudflare API Token（Edit Cloudflare Workers 範本＋D1 Edit）
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 帳號 ID
# Worker 的密碼類設定（Gmail 應用程式密碼、管理頁密碼）仍只放在 Cloudflare 後台，這裡不需要。

on:
  push:
    branches: [main]
    paths:
      - 'executive-table/**'
      - 'shop/products.json'
      - 'anning/stay.json'
      - 'wrangler.jsonc'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 檢查 Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::缺少 GitHub Secret CLOUDFLARE_API_TOKEN"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::缺少 GitHub Secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: 部署
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
