name: Deploy site to Cloudflare

# daoissimple.com 新網站 Worker（site/wrangler.jsonc，MOTHER-UPGRADE 5.3、5.7）。
# 部署到 Jianchiachi 帳號，與 executive-table 同帳號，/api/* 走 Service binding。
# 用的是 worker.yml 部署 executive-table 的同一組 Secrets：
#   CLOUDFLARE_API_TOKEN   Jianchiachi 帳號的 API Token
#   CLOUDFLARE_ACCOUNT_ID  Jianchiachi 帳號 ID
#
#   main：      wrangler deploy（正式版本，網址 daoissimple-site.jianchiachi.workers.dev）
#   其他分支：  wrangler versions upload --preview-alias <別名>（不影響正式版本）
#
# 分支上的第一次 versions upload 會在 Worker 還不存在時失敗，這是預期的；
# 合併到 main、第一次 wrangler deploy 之後，分支預覽就會正常。
# 網域移轉（5.13）完成前不設 routes，只部署到 workers.dev。

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: site-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 檢查 Secrets
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::缺少 GitHub Secret CLOUDFLARE_API_TOKEN"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::缺少 GitHub Secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: 組站
        run: tools/build_site.sh cloudflare

      - name: 部署正式版本（main）
        if: github.ref == 'refs/heads/main'
        run: |
          npx --yes wrangler@4 deploy --config site/wrangler.jsonc
          {
            echo "### 已部署正式版本"
            echo
            echo "https://daoissimple-site.jianchiachi.workers.dev"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上傳分支預覽（其他分支）
        if: github.ref != 'refs/heads/main'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # 別名：小寫、非英數字元換成 -（連續的併成一個）、頭尾不留 -。
          # Cloudflare 規定別名要以小寫字母開頭，且「別名-daoissimple-site」不超過 63 字元。
          SUFFIX="-daoissimple-site"
          MAX=$((63 - ${#SUFFIX}))
          ALIAS=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          case "$ALIAS" in [a-z]*) ;; *) ALIAS="b-$ALIAS" ;; esac
          ALIAS=$(printf '%s' "${ALIAS:0:$MAX}" | sed -E 's/-+$//')
          echo "預覽別名：$ALIAS"

          npx --yes wrangler@4 versions upload --config site/wrangler.jsonc --preview-alias "$ALIAS"
          {
            echo "### 分支預覽"
            echo
            echo "分支：\`$BRANCH\`"
            echo
            echo "https://$ALIAS$SUFFIX.jianchiachi.workers.dev"
          } >> "$GITHUB_STEP_SUMMARY"
