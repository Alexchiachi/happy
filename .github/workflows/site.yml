name: Deploy site to Cloudflare

# daoissimple.com 新網站 Worker（site/wrangler.jsonc，MOTHER-UPGRADE 5.3、5.7）。
# 部署到 Dadaoissimple 帳號，用的是 SITE_ 開頭的 Secrets；
# 不要改用 worker.yml 的 CLOUDFLARE_API_TOKEN，那把屬於 Jianchiachi 帳號。
#
#   main：      wrangler deploy（正式版本，網址 daoissimple-site.dadaoissimple.workers.dev）
#   其他分支：  wrangler versions upload --preview-alias <別名>（不影響正式版本）
#
# 需要的 GitHub Secrets：
#   SITE_CLOUDFLARE_API_TOKEN   Dadaoissimple 帳號的 API Token
#   SITE_CLOUDFLARE_ACCOUNT_ID  Dadaoissimple 帳號 ID
#   PROXY_SECRET                與 executive-table 相同的一串，轉送 /api/* 時帶上（5.3b）
#
# PROXY_SECRET 以 --secrets-file 隨版本一起上傳：
# 寫進 $RUNNER_TEMP 的暫存 JSON（權限 600），步驟結束一定刪除，不寫進倉庫、不印在 log。
#
# 分支上的第一次 versions upload 會在 Worker 還不存在時失敗，這是預期的；
# 合併到 main、第一次 wrangler deploy 之後，分支預覽就會正常。

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: site-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.SITE_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SITE_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 檢查 Secrets
        env:
          PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::缺少 GitHub Secret SITE_CLOUDFLARE_API_TOKEN"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::缺少 GitHub Secret SITE_CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          [ -n "$PROXY_SECRET" ] || { echo "::error::缺少 GitHub Secret PROXY_SECRET"; exit 1; }

      - name: 組站
        run: tools/build_site.sh cloudflare

      - name: 部署正式版本（main）
        if: github.ref == 'refs/heads/main'
        env:
          PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
        run: |
          umask 077
          SECRETS_FILE="$RUNNER_TEMP/site-secrets.json"
          trap 'rm -f "$SECRETS_FILE"' EXIT
          jq -n '{PROXY_SECRET: env.PROXY_SECRET}' > "$SECRETS_FILE"
          npx --yes wrangler@4 deploy --config site/wrangler.jsonc --secrets-file "$SECRETS_FILE"
          {
            echo "### 已部署正式版本"
            echo
            echo "https://daoissimple-site.dadaoissimple.workers.dev"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上傳分支預覽（其他分支）
        if: github.ref != 'refs/heads/main'
        env:
          PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # 別名：小寫、非英數字元換成 -（連續的併成一個）、頭尾不留 -。
          # Cloudflare 規定別名要以小寫字母開頭，且「別名-daoissimple-site」不超過 63 字元。
          SUFFIX="-daoissimple-site"
          MAX=$((63 - ${#SUFFIX}))
          ALIAS=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          case "$ALIAS" in [a-z]*) ;; *) ALIAS="b-$ALIAS" ;; esac
          ALIAS=$(printf '%s' "${ALIAS:0:$MAX}" | sed -E 's/-+$//')
          echo "預覽別名：$ALIAS"

          umask 077
          SECRETS_FILE="$RUNNER_TEMP/site-secrets.json"
          trap 'rm -f "$SECRETS_FILE"' EXIT
          jq -n '{PROXY_SECRET: env.PROXY_SECRET}' > "$SECRETS_FILE"
          npx --yes wrangler@4 versions upload --config site/wrangler.jsonc \
            --secrets-file "$SECRETS_FILE" --preview-alias "$ALIAS"
          {
            echo "### 分支預覽"
            echo
            echo "分支：\`$BRANCH\`"
            echo
            echo "https://$ALIAS$SUFFIX.dadaoissimple.workers.dev"
          } >> "$GITHUB_STEP_SUMMARY"
